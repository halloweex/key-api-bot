name: Deploy to Hetzner

on:
  push:
    branches:
      - main
    # Changes that cannot alter what runs in a container do not deploy one.
    # A merged README used to rebuild both images, restart the containers and
    # hold the `deploy-production` concurrency slot while it did — three
    # minutes of risk for a paragraph.
    #
    # `paths-ignore` skips the run only when EVERY changed file matches, so a
    # commit touching code and a doc together deploys exactly as before. Tests
    # are listed for the same reason: they never ship inside the image.
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.planning/**'
      - 'tests/**'
      - '.idea/**'
      - 'LICENSE'
      - '.gitignore'

# Third-party actions are pinned to commit SHAs (not movable tags) so a
# compromised/retagged action cannot silently enter the prod pipeline.

# One deploy at a time. Two merges 12 seconds apart on 2026-08-08 put two SSH
# sessions on the same host running `docker compose up -d` simultaneously: one
# was removing keycrm-web while the other tried to recreate it, and the run died
# on "removal of container ... is already in progress". Docker then could not
# free the name, so the surviving container came up as 370b903dcd15_keycrm-web
# and every `docker exec keycrm-web` broke until the next clean recreate.
#
# cancel-in-progress stays false deliberately. Cancelling a deploy midway
# through recreating a container is the failure we are preventing, not a
# cheaper version of it — the queued run waits, it does not fight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_ENV

      # Advisory dependency audit — reports CVEs in requirements.txt without
      # failing the build. Dependabot alerts are disabled on this repo, so this
      # is the only automated signal. Promote to a blocking check once the
      # baseline is clean. Re-evaluate if Dependabot is enabled later.
      - name: Audit Python dependencies (advisory)
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push bot Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/keycrm-bot:latest
            ${{ secrets.DOCKER_USERNAME }}/keycrm-bot:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-bot:buildcache-arm64
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-bot:buildcache-arm64,mode=max

      - name: Build and push web Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/keycrm-web:latest
            ${{ secrets.DOCKER_USERNAME }}/keycrm-web:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-web:buildcache-arm64
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-web:buildcache-arm64,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    # Manual-approval gate: this job pauses until a required reviewer of the
    # `production` environment approves it. Configure once in repo Settings →
    # Environments → production → Required reviewers. Prevents an unreviewed
    # push to main from auto-deploying to prod. Until a reviewer is configured
    # the environment exists with no rules and the job runs as before.
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799  # v1.0.0
        env:
          # Pin the server's checkout to the exact commit that was built and
          # approved, not whatever `main` HEAD happens to be at SSH time.
          # `git pull origin main` is racy: a push between approval and SSH
          # would silently deploy unreviewed code.
          GH_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GH_SHA
          script: |
            set -e
            cd /opt/key-api-bot
            git fetch origin
            # Surface any uncommitted/untracked state about to be clobbered —
            # this once silently overwrote a host-side tweak to weekly_compact.sh.
            DIRTY="$(git status --porcelain)"
            if [ -n "$DIRTY" ]; then
              echo "::warning::server tree dirty before reset --hard:"
              echo "$DIRTY"
            fi
            git reset --hard "$GH_SHA"
            docker compose pull
            # Recreate only what actually changed. --force-recreate replaced
            # every service, healthy dependencies included, and a dependent
            # waiting on `condition: service_healthy` then found its target
            # container gone mid-swap:
            #   dependency failed to start: No such container: <id>
            # That killed the deploys for a6801bd and 3f62bb1 on 2026-08-05,
            # on meilisearch and on web respectively. Compose already
            # recreates a service whose image or config changed, which is the
            # only recreation a deploy needs.
            docker compose up -d
            # A container that starts and then falls over must fail the run,
            # not pass it quietly. web is not published on the host, so the
            # gate goes through nginx — which also proves the proxy is up.
            timeout 180 sh -c \
              'until curl -fsS http://127.0.0.1/api/health >/dev/null 2>&1; do sleep 5; done'
            docker image prune -f

      - name: Bump version
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          bash scripts/bump_version.sh
