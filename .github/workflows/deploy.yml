name: Deploy to Hetzner

on:
  push:
    branches:
      - main
    # Changes that cannot alter what runs in a container do not deploy one.
    # A merged README used to rebuild both images, restart the containers and
    # hold the `deploy-production` concurrency slot while it did — three
    # minutes of risk for a paragraph.
    #
    # `paths-ignore` skips the run only when EVERY changed file matches, so a
    # commit touching code and a doc together deploys exactly as before. Tests
    # are listed for the same reason: they never ship inside the image.
    paths-ignore:
      - '**/*.md'
      - '.claude/**'
      - '.planning/**'
      - 'tests/**'
      - '.idea/**'
      - 'LICENSE'
      - '.gitignore'

# Third-party actions are pinned to commit SHAs (not movable tags) so a
# compromised/retagged action cannot silently enter the prod pipeline.

# One deploy at a time. Two merges 12 seconds apart on 2026-08-08 put two SSH
# sessions on the same host running `docker compose up -d` simultaneously: one
# was removing keycrm-web while the other tried to recreate it, and the run died
# on "removal of container ... is already in progress". Docker then could not
# free the name, so the surviving container came up as 370b903dcd15_keycrm-web
# and every `docker exec keycrm-web` broke until the next clean recreate.
#
# cancel-in-progress stays false deliberately. Cancelling a deploy midway
# through recreating a container is the failure we are preventing, not a
# cheaper version of it — the queued run waits, it does not fight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Which half this run deploys — the Python app, the Rust pilot, or both —
  # measured from the last deploy of each half that worked, not from the
  # previous push. `concurrency` cancels a run still pending when a newer one
  # queues, so the newer one must carry the cancelled one's changes; and a
  # run whose Rust half failed has not deployed it. A half's baseline is the
  # newest run on main in which that half's deploy job succeeded; with none,
  # everything counts as changed. The rules are deploy/changed_components.py.
  changes:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: read
      actions: read
    outputs:
      python: ${{ steps.classify.outputs.python }}
      rust_image: ${{ steps.classify.outputs.rust_image }}
      rust_deploy: ${{ steps.classify.outputs.rust_deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the changes since each half last deployed
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The newest run on main whose job $1 succeeded, if this commit
          # descends from it; nothing otherwise — and nothing when the API
          # does not answer, which makes everything count as changed: a full
          # deploy, what every run did before the halves were told apart.
          last_deployed() {
            local runs id sha ok
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml \
                     --branch main --status completed --limit 40 \
                     --json databaseId,headSha --jq '.[] | "\(.databaseId) \(.headSha)"') || runs=""
            while read -r id sha; do
              [ -n "$id" ] || continue
              ok=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
                     --jq ".jobs[] | select(.name == \"$1\" and .conclusion == \"success\") | .name") || ok=""
              if [ -n "$ok" ] && git merge-base --is-ancestor "$sha" "$GITHUB_SHA" 2>/dev/null; then
                echo "$sha"
                return 0
              fi
            done <<< "$runs"
          }
          flags() {
            if [ -z "$1" ]; then
              printf 'python=true\nrust_image=true\nrust_deploy=true\n'
            else
              git diff --name-only --no-renames "$1" "$GITHUB_SHA" \
                | python3 deploy/changed_components.py
            fi
          }
          python_base=$(last_deployed deploy)
          rust_base=$(last_deployed deploy-rust)
          echo "Python half since ${python_base:-no deploy}, Rust half since ${rust_base:-no deploy}"
          flags "$python_base" | grep '^python=' | tee -a "$GITHUB_OUTPUT"
          flags "$rust_base" | grep '^rust_' | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    runs-on: ubuntu-latest
    if: needs.changes.outputs.python == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> $GITHUB_ENV

      # Advisory dependency audit — reports CVEs in requirements.txt without
      # failing the build. Dependabot alerts are disabled on this repo, so this
      # is the only automated signal. Promote to a blocking check once the
      # baseline is clean. Re-evaluate if Dependabot is enabled later.
      - name: Audit Python dependencies (advisory)
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit
          pip-audit -r requirements.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push bot Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/keycrm-bot:latest
            ${{ secrets.DOCKER_USERNAME }}/keycrm-bot:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-bot:buildcache-arm64
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-bot:buildcache-arm64,mode=max

      # The migration runner. Tiny — slim base plus three pure wheels, no gcc,
      # no libgomp, no frontend — and built here rather than being a command on
      # the web image so that Alembic stays out of the application's own
      # images. See Dockerfile.migrate for why that separation is structural
      # rather than tidiness.
      - name: Build and push migrate Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: ./Dockerfile.migrate
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/keycrm-migrate:latest
            ${{ secrets.DOCKER_USERNAME }}/keycrm-migrate:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-migrate:buildcache-arm64
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-migrate:buildcache-arm64,mode=max

      - name: Build and push web Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/keycrm-web:latest
            ${{ secrets.DOCKER_USERNAME }}/keycrm-web:${{ env.VERSION }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-web:buildcache-arm64
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-web:buildcache-arm64,mode=max

  # The Rust pilot's image (rust/README.md), built only when its half changed.
  # On an arm64 runner, natively: the host is arm64, and Rust compiled under
  # QEMU — how the Python images above are built — takes many times as long.
  build-rust:
    needs: changes
    if: needs.changes.outputs.rust_image == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # No `target`: Dockerfile.rust's last stage, the service, built without
      # the `test-clock` feature. Its `harness` stage is the CI's and is never
      # pushed. Tagged by commit as well, so a rollback has a name to pull.
      - name: Build and push the Rust pilot's image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: rust
          file: ./Dockerfile.rust
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/keycrm-rust-api:latest
            ${{ secrets.DOCKER_USERNAME }}/keycrm-rust-api:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-rust-api:buildcache-arm64
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/keycrm-rust-api:buildcache-arm64,mode=max

  deploy:
    needs: [changes, build]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.python == 'true'
    # Manual-approval gate: this job pauses until a required reviewer of the
    # `production` environment approves it. Configure once in repo Settings →
    # Environments → production → Required reviewers. Prevents an unreviewed
    # push to main from auto-deploying to prod. Until a reviewer is configured
    # the environment exists with no rules and the job runs as before.
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Deploy to Hetzner
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799  # v1.0.0
        env:
          # Pin the server's checkout to the exact commit that was built and
          # approved, not whatever `main` HEAD happens to be at SSH time.
          # `git pull origin main` is racy: a push between approval and SSH
          # would silently deploy unreviewed code.
          GH_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GH_SHA
          script: |
            set -e
            cd /opt/key-api-bot
            git fetch origin
            # Surface any uncommitted/untracked state about to be clobbered —
            # this once silently overwrote a host-side tweak to weekly_compact.sh.
            DIRTY="$(git status --porcelain)"
            if [ -n "$DIRTY" ]; then
              echo "::warning::server tree dirty before reset --hard:"
              echo "$DIRTY"
            fi
            git reset --hard "$GH_SHA"
            docker compose pull
            # Recreate only what actually changed. --force-recreate replaced
            # every service, healthy dependencies included, and a dependent
            # waiting on `condition: service_healthy` then found its target
            # container gone mid-swap:
            #   dependency failed to start: No such container: <id>
            # That killed the deploys for a6801bd and 3f62bb1 on 2026-08-05,
            # on meilisearch and on web respectively. Compose already
            # recreates a service whose image or config changed, which is the
            # only recreation a deploy needs.
            docker compose up -d
            # The migration is a one-off container, and `up -d` neither waits
            # for it nor reads its exit code — verified on a throwaway compose
            # project: a service exiting 1 still leaves `up -d` at 0. So a
            # failed revision would deploy green, which is the same disease as
            # the 301 gate below and was shipped in the same repository three
            # PRs after that one was fixed. Rule 13 is about the pipeline too.
            #
            # `docker wait` blocks until the container exits and prints its
            # code; on one that has already exited it returns immediately. A
            # missing container is a failure as well: the service is declared,
            # so `up -d` was supposed to have produced it.
            MIGRATE_RC="$(docker wait ks-migrate 2>/dev/null || echo missing)"
            if [ "$MIGRATE_RC" != "0" ]; then
              echo "::error::schema migration failed (exit ${MIGRATE_RC})"
              docker logs --tail=100 ks-migrate 2>&1 || true
              exit 1
            fi
            # A container that starts and then falls over must fail the run,
            # not pass it quietly. web is not published on the host, so the
            # gate goes through nginx — which also proves the proxy is up.
            #
            # IT DID NOT DO THAT UNTIL 2026-08-23. The line here used to be
            #   curl -fsS http://127.0.0.1/api/health
            # and nginx answers plain HTTP with a blanket 301 to HTTPS
            # (nginx/nginx.conf:42). `curl -f` does not fail on a 3xx and there
            # was no `-L`, so the gate exited 0 on the redirect without ever
            # touching web. It reported success for the whole of a four-minute
            # 502 outage that day. A check that answers instead of doing is
            # exactly what charter rule 13 is about, and it was sitting inside
            # the pipeline that enforces the charter.
            #
            # `--resolve` keeps this on loopback — no public DNS round trip —
            # while still sending the SNI and Host the HTTPS vhost matches on.
            # `-k` skips certificate verification on purpose: whether the
            # certificate is valid is a different question from whether this
            # release is serving, and UptimeRobot already watches expiry.
            # The status is compared to 200 explicitly rather than left to
            # `-f`, so this cannot quietly go back to accepting a redirect.
            #
            # Verified both ways on the host before it was committed: 200 and
            # exit 0 against the live vhost, and exit 124 against a dead port.
            timeout 180 sh -c \
              'until [ "$(curl -sk -o /dev/null -w "%{http_code}" \
                 --resolve ksanalytics.duckdns.org:443:127.0.0.1 \
                 https://ksanalytics.duckdns.org/api/health)" = 200 ]; do sleep 5; done'
            docker image prune -f

      - name: Bump version
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          bash scripts/bump_version.sh

  # The Rust pilot's half: its service, and the routes nginx sends to it. After
  # the Python half when both changed, so one SSH session at a time works on
  # the host; with the Python half skipped, it runs alone. The checkout is
  # reset to this commit either way — that is how an edit of
  # nginx/rust/routes.conf, which is how a route is switched, reaches nginx.
  deploy-rust:
    needs: [changes, build-rust, deploy]
    runs-on: ubuntu-latest
    if: "!cancelled() && !failure() && needs.changes.outputs.rust_deploy == 'true'"
    environment: production

    steps:
      - name: Deploy the Rust pilot
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799  # v1.0.0
        env:
          GH_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GH_SHA
          script: |
            set -e
            cd /opt/key-api-bot
            git fetch origin
            DIRTY="$(git status --porcelain)"
            if [ -n "$DIRTY" ]; then
              echo "::warning::server tree dirty before reset --hard:"
              echo "$DIRTY"
            fi
            git reset --hard "$GH_SHA"
            # `--profile rust`: without it every compose command acts as if the
            # service did not exist, which is what keeps the Python half off
            # it. Recreated only when its image or its config changed.
            docker compose --profile rust pull rust-api
            docker compose --profile rust up -d --no-deps rust-api
            # Healthy, not merely started: the healthcheck reads the schema
            # revision as ks_readonly, so an image older than the schema fails
            # here rather than after a route reaches it.
            if ! timeout 120 sh -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" ks-rust-api 2>/dev/null)" = healthy ]; do sleep 3; done'; then
              echo "::error::ks-rust-api is not healthy"
              docker logs --tail=50 ks-rust-api 2>&1 || true
              exit 1
            fi
            # nginx reads routes.conf on a reload only. `-t` first: a broken
            # file fails the run here, instead of a reload that nginx refuses
            # in silence while it keeps serving the old routes.
            docker exec keycrm-nginx nginx -t
            docker exec keycrm-nginx nginx -s reload
            docker image prune -f
