# The suite, on every pull request.
#
# Until this existed, `.github/workflows/deploy.yml` was the only workflow in
# the repository and it triggers on push to `main`. A pull request was verified
# by nothing at all: 1,639 tests ran only on the author's machine, and a
# forgotten `pytest` reached production with production as the first thing to
# notice.
#
# WHY THERE IS NO `paths-ignore` HERE
#
# The deploy has one, and it is right to: a merged README cannot change what
# runs in a container, and rebuilding two images for a paragraph was three
# minutes of risk for nothing. The opposite holds for this workflow. A
# tests-only change is *exactly* the change that must run the tests, and
# `tests/**` is in the deploy's ignore list — so a paths filter copied from
# there would skip the suite on the pull requests that are nothing but suite.
# Running it on a documentation PR costs about a minute and buys the property
# that a green check means the same thing on every PR.
#
# WHY THERE IS A POSTGRES HERE
#
# The differential tests — the ones proving DuckDB and PostgreSQL answer the
# same question the same way — skip themselves when `KS_PG_DSN` is unset, and
# it was unset here. **60 tests never ran**, including all 20 that guard the
# /traffic port, on a tab that reads PostgreSQL in production behind a silent
# fallback to DuckDB: a query that broke in one engine only would have kept
# the page working and left an ERROR in a log nobody reads. `deploy/
# gate_with_stores.sh` has supplied a DSN since 2026-08-31, but that is a
# thing a person remembers to run, and a check that runs when remembered is
# not what a pull request needs.
#
# A throwaway container started after checkout, not a `services:` block:
# service containers start *before* the checkout step, so they cannot mount
# `postgres/initdb`, and those scripts are what create the roles and schemas
# the migrations then need.
#
# WHAT THIS DOES NOT DO
#
# It does not touch ClickHouse, KeyCRM, the production PostgreSQL or the
# production DuckDB file. `pytest.ini` deselects the `external` marker by
# default, which is what makes a bare `pytest` safe to run anywhere, and this
# deliberately does not override it. The external suite reaches the live API
# and the production database; it stays a thing a person runs on purpose.
# ClickHouse is still absent, so its own differential tests still skip.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push supersedes the first. `main` is exempt: cancelling a run there
# would leave the branch that deploys with no verdict at all.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Matches `Dockerfile.web`'s `python:3.14-slim`. Pinned to the minor
      # version on purpose: the runtime image is, and a suite passing on a
      # Python production does not run is a green check that means nothing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      # The lock, so this job holds the versions production holds. Installing
      # `requirements-dev.txt` would re-resolve, and a check that runs against
      # a different set from the one being deployed is a check about nothing.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock

      # 17.2-alpine, the version the VPS runs and the version the gate script
      # uses. The password is a literal because the container lives for one
      # job, publishes to localhost only, and holds nothing.
      - name: Start a throwaway PostgreSQL
        run: |
          docker run -d --name ci-pg -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=ci-only \
            -e POSTGRES_DB=ks \
            -e POSTGRES_INITDB_ARGS="--locale=C.UTF-8 --encoding=UTF8" \
            -v "$PWD/postgres/initdb:/docker-entrypoint-initdb.d:ro" \
            postgres:17.2-alpine
          # Wait for the entrypoint to finish before waiting for the server.
          # The image starts a *temporary* postgres to run the initdb scripts,
          # then shuts it down and starts the real one — so `pg_isready` says
          # yes to the temporary server, and the very next `psql` lands in the
          # shutdown and fails with "the database system is shutting down".
          # That is exactly how this failed on 2026-09-09: the first two runs
          # passed on timing luck, and the third had to pull the image, which
          # moved the poll into the gap. Waiting on the entrypoint's own line
          # makes it timing-independent.
          for _ in $(seq 1 90); do
            docker logs ci-pg 2>&1 \
              | grep -q "PostgreSQL init process complete" && break
            sleep 1
          done
          for _ in $(seq 1 60); do
            docker exec ci-pg pg_isready -U postgres -d ks >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec ci-pg psql -U postgres -d ks -tAc "SELECT 1" >/dev/null
          docker exec ci-pg psql -U postgres \
            -tAc "ALTER ROLE ks_app WITH PASSWORD 'ci-only'" >/dev/null

      # `alembic upgrade head`, so the suite meets the schema at
      # `core.pg.REQUIRED_REVISION` — the same thing `ks-migrate` does before
      # web and bot are allowed to start.
      - name: Apply the migrations
        env:
          KS_PG_DSN: postgresql://ks_app:ci-only@127.0.0.1:5432/ks
        run: |
          alembic upgrade head
          docker exec ci-pg psql -U postgres -d ks -tAc \
            "SELECT version_num FROM meta.alembic_version"

      # No paths, no markers, no flags. `pytest.ini` owns `testpaths`,
      # `asyncio_mode` and the deselections, so what runs here is exactly what
      # runs on a laptop — which is the point of a check.
      #
      # `KS_PG_DSN` is the one addition, and it *unskips* rather than changes:
      # every test that reads it creates and drops its own rows in the
      # throwaway database.
      #
      # `-rs` so the run reports what it skipped, and the next step reads that
      # rather than running the suite a second time to ask.
      - name: Run the suite
        env:
          KS_PG_DSN: postgresql://ks_app:ci-only@127.0.0.1:5432/ks
        run: set -o pipefail && pytest -q -rs | tee pytest.out

      # A store test that skipped is a check that silently stopped running,
      # which is the failure this whole block exists to prevent — so it fails
      # the job instead of printing a number nobody reads. Only PostgreSQL
      # skips are caught: ClickHouse has no container here and its own
      # differential tests are expected to skip.
      - name: No store test may have skipped
        if: always()
        run: |
          # No file means the suite never ran, and whichever step failed
          # before it is the real error. Grepping a missing file here added
          # two more ##[error] lines pointing at nothing, which is how the
          # 2026-09-09 failure read as a skip problem when it was a startup
          # race.
          [ -f pytest.out ] || { echo "suite did not run — see the step above"; exit 0; }
          skipped=$(grep -c "needs a live PostgreSQL" pytest.out || true)
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped test(s) skipped for want of PostgreSQL"
            grep "needs a live PostgreSQL" pytest.out
            exit 1
          fi

      - name: Stop the throwaway PostgreSQL
        if: always()
        run: docker rm -f ci-pg || true
