# Docker's json-file driver defaults to one unbounded file per container, on a
# disk that is already 59% full, and it is discarded when the container is
# recreated — so every deploy erases the only request history this system has.
# Bounded rotation caps the cost and keeps ~250 MB per service instead of one
# file that is either too big or gone.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

networks:
  # Declared external and by a fixed name so `ks-tg-bot` — a different compose
  # project — can reach this Postgres. Created once, by hand, and it already
  # exists on the host:  docker network create ks-data
  #
  # THE TRAP, and it now lives in this file: the moment a service here gains a
  # `networks:` key it stops joining `default` implicitly. `postgres` and
  # `web` below therefore list BOTH. Do not add a `networks:` key to bot,
  # nginx or meilisearch without also listing `default` — nginx would lose
  # `proxy_pass http://web` and fail silently, because it only resolves the
  # name when a request arrives, so nothing complains at startup.
  ks-data:
    external: true

services:
  # ── Postgres: the system of record ───────────────────────────────────────
  #
  # Lives here, not in `ks-data-platform`, by the owner's decision of
  # 2026-08-23: a store lives beside its primary writer, and this one is
  # written row by row by this application on this application's deploy.
  # ClickHouse stays in the platform repo — it is written in rare batches by
  # an ETL, which is a different lifecycle.
  #
  # Rule 12 of the charter: no `ports:` key, ever. `ufw` is off on this host,
  # the server takes ~1000 scanner requests a day, and "just while we set it
  # up" means "we opened it". Reach it from another container on one of the
  # two networks above, or with `docker compose exec`.
  postgres:
    image: postgres:17.2-alpine
    container_name: ks-postgres
    restart: unless-stopped
    logging: *default-logging
    networks: [default, ks-data]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      POSTGRES_DB: ks
      # Off-host backups need reproducible collation; the alpine image defaults
      # to C, and saying so out loud stops a future image bump from moving it.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      KS_APP_PASSWORD: ${KS_APP_PASSWORD:?set it in .env}
      KS_READONLY_PASSWORD: ${KS_READONLY_PASSWORD:?set it in .env}
    # Sized for a host with 7.7 GiB total that already peaks near 5 GiB during
    # the nightly export. 128 → 256 MB on 28.08: the database crossed 140 MB
    # (the order-versions baseline alone is 25 MB), so the working set no
    # longer fit — and the standing rule is that this is the cheap answer to
    # «объём», not a ClickHouse trigger.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
      - -c
      - wal_compression=on
      # THE MINE, defused. Default is -1, meaning a replication slot whose
      # consumer has gone away holds WAL *forever* — until the disk is full.
      # The disk here is one 75 GB partition shared by the OS, the images, the
      # DuckDB warehouse, every backup and both databases; filling it takes
      # everything down, not just Postgres. With a ceiling the slot is
      # invalidated instead: PITR continuity breaks and needs a fresh base
      # backup, which is a bad morning rather than an outage.
      - -c
      - max_slot_wal_keep_size=4GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data directory. Roles and schemas only — no
      # tables. Charter rule 11: the platform owns servers, the application
      # owns its DDL.
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./backups/postgres:/backups
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      # NOT `pg_isready`. Charter rule 13, added 2026-08-22: a check that does
      # not do the system's work only proves the process is alive. `pg_isready`
      # executes no query, which is why 9 connection failures out of 20 at
      # concurrency 20 — caused by a 64 MB `/dev/shm` — were invisible to it.
      # Verified against the live container before this line was written.
      test: ["CMD-SHELL", "psql -U postgres -d ks -tAc 'SELECT 1' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Provisioning that must survive a non-empty data directory ────────────
  #
  # `/docker-entrypoint-initdb.d` runs ONLY against an empty data directory.
  # That is not a quirk to work around later: it already cost the platform a
  # healthy server with no databases and no warning after a failed first boot.
  # So the same files are re-applied here on every `up -d`, and every statement
  # in them is written to be a no-op the second time.
  #
  # Only `*.sql` — `20-replication-hba.sh` edits pg_hba.conf from inside the
  # server's own container and has already run; it is idempotent too, but it is
  # not psql's to execute.
  #
  # `restart: "no"` and it exits: this is an init container, so `Exited (0)` in
  # `docker compose ps` is the healthy steady state. A non-zero exit means a
  # statement failed, and `ON_ERROR_STOP=1` makes sure it does not pass quietly
  # — Rule 13 applies to provisioning as much as to healthchecks.
  postgres-bootstrap:
    image: postgres:17.2-alpine
    container_name: ks-postgres-bootstrap
    restart: "no"
    logging: *default-logging
    networks: [default]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      KS_APP_PASSWORD: ${KS_APP_PASSWORD:?set it in .env}
      KS_READONLY_PASSWORD: ${KS_READONLY_PASSWORD:?set it in .env}
    volumes:
      - ./postgres/initdb:/initdb:ro
    entrypoint:
      - sh
      - -c
      - 'set -e; for f in /initdb/*.sql; do echo "── $$f"; psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d ks -f "$$f"; done'
    mem_limit: 64m
    memswap_limit: 64m

  # ── Continuous WAL, i.e. the recovery point ──────────────────────────────
  #
  # Owner's decision 2026-08-22: RPO five minutes. Not for the orders — those
  # come back from KeyCRM, which stays the source of truth — but for what
  # nothing can return: inventory snapshots, campaign membership, opt-outs,
  # manager classifications, the bots' own state. Twenty-five days of stock
  # history are already missing and cannot be recovered from anywhere.
  #
  # WHY STREAMING AND NOT `archive_command`. An archive command ships whole
  # 16 MB segments, so the recovery point is "when the segment filled" —
  # forcing five minutes means `archive_timeout=300`, which writes a padded
  # 16 MB segment every five minutes whether or not anything happened: about
  # 4.6 GB a day of mostly zeroes. Streaming writes what there is, when there
  # is. And streaming needs no restart, where `archive_mode` would.
  #
  # This comment said "measured WAL volume on this database is 23.3 MiB/day"
  # until 2026-08-31. `pg_stat_wal` says 16 GB since 2026-08-20 — **1.5 GB a
  # day, 65x that** — and the argument above survives it unharmed: 1.5 GB of
  # real WAL still beats 4.6 GB of padding. The figure was measured before
  # Postgres began deriving anything. What generates it, from
  # pg_stat_user_tables over the same window:
  #
  #   silver.orders        19.1M inserts + 18.9M updates over 46,982 live rows
  #   app.customer_profile  5.2M inserts over 18,418
  #   gold.daily_revenue    1.7M inserts over 5,714
  #
  # — i.e. ~400 whole-table rebuilds, and `silver.orders` pays twice because
  # `rebuild_silver` follows its INSERT with a full-table pass-2 UPDATE, and an
  # UPDATE here is a second row version. Folding pass 2 into pass 1 would
  # roughly halve the largest contributor; it is not a free change, because
  # that SQL body is shared with DuckDB, whose incremental path scopes pass 2
  # by buyer and would not benefit the same way.
  #
  # Not urgent: with retention now anchored to a base backup
  # (deploy/pg_basebackup.sh) the archive is bounded by the PITR window, so
  # this sizes the window rather than threatening the disk.
  #
  # Read `max_slot_wal_keep_size` above before changing anything here: this
  # service is the slot's consumer, and the two are a pair.
  pg-receivewal:
    image: postgres:17.2-alpine
    container_name: ks-pg-receivewal
    restart: unless-stopped
    logging: *default-logging
    networks: [default, ks-data]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
    # --synchronous: flush on receipt rather than per segment. On 23 MiB/day
    # the fsync cost is noise, and without it the recovery point silently
    # becomes "whatever the OS had not written yet".
    command:
      - pg_receivewal
      - --host=postgres
      - --username=postgres
      - --directory=/wal
      # The slot is created by postgres/initdb/20-replication-hba.sh, not by
      # --create-slot: that flag creates the slot and exits zero, which under
      # `restart: unless-stopped` is a loop that reports success and streams
      # nothing.
      - --slot=ks_pitr
      # gzip, not zstd: the server compresses WAL with zstd happily, but
      # pg_receivewal itself answers "compression with ZSTD is not yet
      # supported" and restart-loops. Client and server do not share the codec
      # list, and the error only appears at run time.
      - --compress=gzip:6
      - --synchronous
      - --no-loop
    volumes:
      - ./backups/pg_wal:/wal
    mem_limit: 64m
    memswap_limit: 64m

  # ── The schema, applied on the deploy that carries it ────────────────────
  #
  # Same shape as `postgres-bootstrap` above, one level up: that one creates
  # roles and schemas and never a table, this one creates tables and never a
  # schema. Charter rule 11, as two containers.
  #
  # `restart: "no"` and it exits — an init container, so `Exited (0)` in
  # `docker compose ps` is the healthy steady state and a non-zero exit means
  # a revision failed. Verified against a real server: a missing KS_PG_DSN, a
  # wrong password and an unreachable host all exit 1 with the reason on
  # stderr, which is what makes the exit code worth reading.
  #
  # WHY THIS IS NOT `web` WITH A DIFFERENT COMMAND. Alembic is deliberately
  # absent from the application images. Rule 11 says the app declares the
  # version it needs and fails closed; if the tool were sitting in the image,
  # `alembic.command.upgrade()` would be one import away from startup, and
  # this system's history is a list of self-healing that turned a one-off
  # fault into a loop. Keeping the tool out makes that structural.
  #
  # NOTHING DEPENDS ON IT YET, ON PURPOSE. When `web` first reads Postgres it
  # gains `condition: service_completed_successfully` here. Adding that today
  # would mean a failed migration takes the dashboard down over a database no
  # code touches — charter rule 8 says the step leaves the system working.
  migrate:
    image: halloweex/keycrm-migrate:latest
    container_name: ks-migrate
    restart: "no"
    logging: *default-logging
    networks: [default]
    depends_on:
      postgres: {condition: service_healthy}
      # On `postgres-bootstrap`, not just on a healthy server. The schemas this
      # writes into are created there, and `service_healthy` alone is a race:
      # it happens to hold on a fresh volume, because `initdb` runs inside the
      # entrypoint before the server ever reports healthy — but the whole
      # reason `postgres-bootstrap` exists is the case where the data directory
      # is NOT empty and `initdb` is skipped. In that case both start the
      # moment Postgres is healthy, and a migration can reach `meta` before
      # anything has created it.
      postgres-bootstrap: {condition: service_completed_successfully}
    environment:
      # Built here rather than read whole from .env so the credentials stay in
      # one place: the same KS_APP_PASSWORD `postgres` and `postgres-bootstrap`
      # already take. `ks_app` and not `postgres` — the schema belongs to the
      # role that will own the tables, and a migration run as superuser leaves
      # tables the application cannot alter.
      KS_PG_DSN: postgresql://ks_app:${KS_APP_PASSWORD:?set it in .env}@postgres:5432/ks
    mem_limit: 128m
    memswap_limit: 128m

  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: keycrm-meili
    # Bind to loopback only — the web container reaches Meilisearch over the
    # internal Docker network (meilisearch:7700), so the host port never needs
    # to be internet-facing. Previously "7700:7700" exposed the search index
    # to the world (protected only by MEILI_MASTER_KEY).
    ports:
      - "127.0.0.1:7700:7700"
    volumes:
      - meili_data:/meili_data
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      - MEILI_NO_ANALYTICS=true
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    image: halloweex/keycrm-bot:latest
    container_name: keycrm-bot
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env
    environment:
      - TZ=Europe/Kyiv
      # Step 03: the bot's own state moves to Postgres. `app.*` has held
      # an hourly copy of data/bot.db since revision 0009; this is what
      # makes the bot read and write it instead.
      #
      # Removing KS_BOT_STORE rolls back to SQLite, but anything written
      # to Postgres in between does not come back: the copy is one-way and
      # stands down while this is set.
      - KS_PG_DSN=postgresql://ks_app:${KS_APP_PASSWORD:?set it in .env}@postgres:5432/ks
      - KS_BOT_STORE=postgres
      # Who signs every outbound Telegram. Set here rather than left to the
      # hostname default, which inside a container is the short container id
      # and changes on every recreate. A dev instance that forgets
      # KS_ALERTS_DISABLED at least says whose laptop it is.
      - KS_INSTANCE=${KS_INSTANCE:-prod-vps}
      # Names this process's slice of shared state (both containers mount
      # ./data): the alert gate's decision file is alert-gate-{role}.json.
      - KS_ROLE=bot
    depends_on:
      # The bot checks `REQUIRED_REVISION` in `initialise()` and refuses to
      # start against an older schema — correct, and until this was added it
      # meant every migration cost one crash: `up -d` starts both at once, the
      # bot loses the race, exits, and comes back on the restart policy after
      # `migrate` has finished. Observed on the 0023 deploy, in the log as a
      # RuntimeError naming both revisions.
      #
      # `service_completed_successfully` and not `service_started`: what the
      # bot needs is the migration *finished*, and `migrate` is a one-shot with
      # `restart: "no"` precisely so this condition means what it says.
      #
      # If a migration fails, the bot does not start at all. That is the same
      # answer it reaches on its own today, arrived at in one place instead of
      # a restart loop.
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      # Reads the heartbeat the bot writes on its own event loop after a real
      # read through its store. The previous check was
      # `os.path.exists('/app/data/bot.db')`, which said nothing about whether
      # the bot was polling and became a lie on 2026-08-27, when the bot moved
      # to Postgres and that file was frozen in place.
      #
      # The check must not touch the database itself: under
      # KS_BOT_STORE=postgres it would build a pool and a loop thread every
      # thirty seconds. See bot/heartbeat.py.
      test: ["CMD", "python", "-m", "bot.heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Four beats. A fresh container has no heartbeat at all and is unhealthy
      # until it writes one, which is correct and is what this window is for.
      start_period: 60s

  web:
    image: halloweex/keycrm-web:latest
    container_name: keycrm-web
    restart: unless-stopped
    logging: *default-logging
    # `default` is listed explicitly because naming any network drops the
    # implicit membership (the trap above) — nginx reaches web over it.
    # `ks-data` is how this container reaches `ks-clickhouse`, which lives in
    # the platform's compose project and publishes no ports (rule 12).
    networks: [default, ks-data]
    env_file:
      - .env
    environment:
      - TZ=Europe/Kyiv
      # The same store the bot uses: web/services/auth_service.py reads it
      # to decide who may open the dashboard. The two must agree, or one
      # of them is answering from a database nobody is writing.
      - KS_BOT_STORE=postgres
      # DuckDB's own ceiling, well under mem_limit so Python/pandas/Meili keep
      # room. Raise before a full warehouse rebuild; 3GB is what OOM'd on
      # 2026-08-02 and truncated the Gold layer.
      - DUCKDB_MEMORY_LIMIT=4GB
      # Step 05: the landing mirror. `ks_app`, same credential the migration
      # runner and the bootstrap already take. Absent, the mirror logs an
      # error on every sync instead of writing — which is why it is set here
      # rather than left to whoever remembers.
      - KS_PG_DSN=postgresql://ks_app:${KS_APP_PASSWORD:?set it in .env}@postgres:5432/ks
      # Step 4 of «Одна бронза»: gold copied into ClickHouse hourly. Both come
      # from .env and both may be absent — the shipper and its reconciliation
      # stand down silently without KS_CH_URL, so a host without ClickHouse
      # runs unchanged. The password is the platform's `ks_app` CH user.
      - KS_CH_URL=${KS_CH_URL:-}
      - KS_CH_PASSWORD=${KS_CH_PASSWORD:-}
      # Step 1 of «Одна бронза»: which engine serves the Gold-only reads of
      # /api/summary and /api/revenue/trend. `duckdb` (default) or `postgres`;
      # a typo raises on the first read rather than serving the old store.
      # Rollback is flipping it back — no rebuild, no recreate.
      - KS_READ_GOLD=${KS_READ_GOLD:-duckdb}
      # Who signs every outbound Telegram. Set here rather than left to the
      # hostname default, which inside a container is the short container id
      # and changes on every recreate. A dev instance that forgets
      # KS_ALERTS_DISABLED at least says whose laptop it is.
      - KS_INSTANCE=${KS_INSTANCE:-prod-vps}
      # Names this process's slice of shared state (both containers mount
      # ./data): the alert gate's decision file is alert-gate-{role}.json.
      - KS_ROLE=web
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    depends_on:
      meilisearch:
        condition: service_healthy
      # For the bot's reason, with a quieter failure and therefore a worse one.
      # `web` has no startup revision gate, so deployed ahead of `migrate` it
      # starts happily and every Postgres read raises `SchemaVersionError` —
      # including the session read, which means nobody can log in while the
      # dashboard looks healthy. Waiting here removes the window rather than
      # relying on each read to fail correctly inside it.
      migrate:
        condition: service_completed_successfully
    mem_limit: 7g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: keycrm-nginx
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./nginx/error.html:/etc/nginx/html/error.html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "nginx -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  meili_data:
  # Declared external under its original name so the swap moves no bytes. The
  # volume already holds the verified state — roles, empty schemas,
  # btree_gist 1.7, replication slot `ks_pitr` — and a rehearsed restore was
  # timed against exactly this data directory (charter rule 2: nothing moves
  # before a rehearsed restore). Renaming it to `key-api-bot_pgdata` is a
  # separate, optional step for a separate window; it buys tidiness and costs
  # a copy, and doing both at once would make one rollback undo two things.
  pgdata:
    external: true
    name: ks-data-platform_pgdata
