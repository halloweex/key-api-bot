# GENERATED — do not hand-edit. The exact set production runs.
#
# `requirements.txt` states intent ("fastapi, recent enough"); this states fact
# ("fastapi 0.141.1, and the forty-odd packages that came with it"). Both
# images and CI install from here, so all three environments hold the same
# bytes.
#
# WHY THIS FILE EXISTS
#
# Nothing was pinned above a floor and nothing pinned transitives at all —
# `starlette` is pulled in by `fastapi` and appeared in no requirements file.
# Every deploy rebuilds the image with `pip install -r requirements.txt`, so
# what production ran was decided by whatever pip resolved that minute, on a
# machine nobody was watching. It crossed a **major** boundary that way,
# starlette 0.50 → 1.6, and the first anyone knew was CI failing on tests that
# reach into starlette's route tree. That time it was only test introspection.
#
# HOW TO REGENERATE
#
# Never with `pip freeze` on a laptop: wheels are chosen per platform and per
# Python, and production is linux/amd64 on CPython 3.14. Do it in the image's
# own base:
#
#   docker run --rm -v "$PWD:/w" -w /w python:3.14-slim sh -c \
#     'pip install -q -r requirements.txt && pip freeze --exclude-editable' \
#     | grep -viE "^(pip|setuptools|wheel)==" | sort > requirements.lock
#
# Then regenerate requirements-dev.lock the same way (see its header), run the
# suite, and read the diff before committing it — an unexplained line in that
# diff is a dependency change nobody asked for.
#
# This particular file was not resolved fresh. It is `pip freeze` taken from
# the running production container on 2026-08-25, so it records a set that is
# known to work rather than one that merely resolves.
