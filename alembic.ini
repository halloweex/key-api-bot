# Alembic, for the Postgres half of this repository only.
#
# DuckDB has its own ledger — `core/migrations.py`, one row per step in
# `schema_migrations` — and the two do not meet. That file predates Postgres by
# months and is not being replaced; this configures the other store.
#
# `sqlalchemy.url` is deliberately empty. The URL comes from KS_PG_DSN at run
# time (see migrations/env.py); a URL committed here is a URL that eventually
# points at the wrong database from somebody's laptop.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# Zero-padded and ordered, because these are read by people in sequence and
# `a1b2c3d4` tells a reviewer nothing about what came before it.
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
