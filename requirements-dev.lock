# GENERATED — do not hand-edit. What CI installs.
#
# `requirements.lock` plus the eleven packages the suite needs and the runtime
# images must not carry. A strict superset: verified at generation time that
# installing the dev tools moved **no** runtime package — same 64 versions,
# plus alembic, coverage, greenlet, iniconfig, mako, pluggy, pygments, pytest,
# pytest-asyncio, pytest-cov and sqlalchemy.
#
# That property is the point. If the dev install were allowed to nudge, say,
# `pydantic`, CI would be testing a set production does not run — which is the
# exact hole this pair of files closes.
#
# HOW TO REGENERATE
#
#   docker run --rm -v "$PWD:/w" -w /w python:3.14-slim sh -c \
#     'pip install -q -r requirements.lock -r requirements-dev.txt \
#      && pip freeze --exclude-editable' \
#     | grep -viE "^(pip|setuptools|wheel)==" | sort > requirements-dev.lock
#
# Then diff it against requirements.lock and confirm the only difference is the
# dev tools. Generated in the image's own base on purpose: wheels are chosen
# per platform and per Python, and a lock produced on macOS is a lock for
# macOS.
