[pytest]
# Without this file pytest collects from the repository root, which sweeps in
# scripts/ — where two files named like tests are not tests at all, and one of
# them fails on collection every time. `testpaths` is what keeps the suite to
# the suite.
testpaths = tests

# Every async test in this suite carries an explicit @pytest.mark.asyncio
# (402 of them, matching 402 `async def test_`). Strict mode is what keeps that
# true: an async test that loses its marker is skipped silently otherwise.
asyncio_mode = strict

# `external` is deselected by default because those tests reach the live KeyCRM
# API and the production DuckDB file. Run them deliberately:
#     pytest -m external
addopts = -m "not external and not slow"

markers =
    slow: slow tests, deselected by default (run with -m slow)
    external: reaches the live KeyCRM API or the production database
