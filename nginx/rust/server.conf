# Included once, at server level, by nginx/nginx.conf: what every route
# switched to the Rust pilot shares. The switch itself is routes.conf.

# The pilot's address as a VARIABLE, for $web_upstream's reason in nginx.conf:
# a name in a variable is resolved per request. So nginx starts, reloads and
# serves whether or not ks-rust-api exists — its compose profile keeps it out
# of a plain `docker compose up -d` — and a route switched to a container
# that is gone answers through the fallback below instead of taking nginx
# down with "host not found in upstream".
set $rust_upstream ks-rust-api;

# Where a switched route goes when the pilot does not answer it, or answers
# 501 (proxy.conf). The same proxying as `location /api/` in nginx.conf —
# what the route had before it was switched — so a request handed back is
# answered exactly as an unswitched one.
#
# If web does not answer either, the client gets nginx's own 502 page rather
# than error.html: `recursive_error_pages` is off, and a second hop is not
# worth turning it on for.
location @rust_fallback_to_web {
    proxy_pass http://$web_upstream:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 60s;
    access_log /var/log/nginx/access.log timed_upstream;
}

include /etc/nginx/rust/routes.conf;
