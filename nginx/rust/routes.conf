# Routes answered by the Rust pilot (rust/README.md). NONE BY DEFAULT.
#
# A location listed here is proxied to ks-rust-api; every other request keeps
# going to web through nginx.conf, exactly as before this file existed. One
# line per route, an exact match, so nothing else under the same prefix moves
# with it:
#
#   location = /api/revenue/trend { include /etc/nginx/rust/proxy.conf; }
#
# Switch a route: add its line and merge. The deploy's Rust job resets the
# host's checkout to the merge, runs `nginx -t` and `nginx -s reload`.
#
# Take it back: delete the line and merge, the same way. In a hurry, on the
# host first —
#
#   cd /opt/key-api-bot && $EDITOR nginx/rust/routes.conf
#   docker exec keycrm-nginx nginx -t && docker exec keycrm-nginx nginx -s reload
#
# — then merge the same deletion, or the next deploy's `git reset --hard`
# writes the line back.
#
# GET routes only. When the pilot does not answer, or answers 501 ("the
# Python app serves it"), nginx asks web the same request again (proxy.conf):
# harmless for a read, not for anything that writes.
