# Included inside each location of routes.conf: how a switched route reaches
# the Rust pilot, and when it is handed back to web.

proxy_pass http://$rust_upstream:8090;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# What `location /api/` adds to every answer; the route had it before.
expires 60s;

# Handed back to web — the same request, asked again — in two cases only:
#
#  - 501: the pilot's own "Not Implemented — the Python app serves it". It is
#    how the pilot says a request is not its to answer: a branch it does not
#    port (the trend's forecast overlay, source 3), or a route past its
#    gates. The gates have run by then, and web runs its own.
#  - 502 that nginx makes because the pilot did not answer: no such container
#    (the name does not resolve), nothing listening, the connection reset.
#
# Not a 502 to the client, because the fallback is the reference: web reads
# the same Postgres and answers the same request the same way — the harness
# holds the two to the byte. That is not the fallback this project removed
# elsewhere, which served a frozen copy; nothing here can answer from an
# older store. A pilot that stopped costs a few milliseconds, not a broken
# chart, and the fallback is never silent. Every request through here is
# logged with `ua=` and `us=` (nginx.conf), and a handed-back one names both
# hops — rehearsed, the three forms are
#   ua=<pilot>:8090 : <web>:8080 us=501 : 200   the pilot stepped aside
#   ua=<pilot>:8090 : <web>:8080 us=502 : 200   nothing listening
#   ua=, <web>:8080 us=-, 200                   no such container
# and the last two also put a line in nginx's error log ("connect() failed
# (111: Connection refused)", "ks-rust-api could not be resolved").
#
# Every other answer passes through as the pilot gave it: its 400, 401, 403,
# 422 and 429, and its 500, 503 and 504, which are the app's answers too.
# Asking web again on those would hide exactly the disagreement the
# comparison in the runbook looks for.
#
# `proxy_intercept_errors` takes effect only for the codes listed in
# error_page here. Listing any error_page in this location also stops the
# server's `error_page 502 503 504 /error.html` from applying, which is why
# 503 and 504 are not listed: the pilot's own 503 and 504 carry JSON the
# frontend reads.
proxy_intercept_errors on;
error_page 501 502 = @rust_fallback_to_web;

# Inside one network a connect takes well under a millisecond; two seconds
# only bounds an address the resolver has not yet forgotten. Reads: the
# pilot answers its own 504 at 30 s, as web does, so 35 s never cuts one off.
proxy_connect_timeout 2s;
proxy_read_timeout 35s;

access_log /var/log/nginx/access.log timed_upstream;

# A block's own access_log drops the inherited ones: the /api log too.

access_log /var/log/ks-api/api.log ks_api if=$ks_api_path;
