events {
    worker_connections 1024;
}

http {
    # ─── Why there is no `upstream` block here any more ──────────────────────
    #
    # There was one, with `keepalive 32`, and it is what caused the outage on
    # 2026-08-23: an `upstream` block resolves `web:8080` ONCE, at config load,
    # and open-source nginx has no way to re-resolve it (the `resolve` flag on
    # `server` is nginx Plus only). That deploy moved web from 172.18.0.4 to
    # 172.18.0.6 — adding two services to the network shifted allocation — and
    # nginx, two days up and not recreated, went on dialling .4 for four
    # minutes while reporting healthy and while the deploy reported success.
    #
    # Normally invisible, which is the dangerous part: a recreated container
    # usually reclaims its old address, so this only bites when the network's
    # membership changes. Reproduced deliberately on this host with two probe
    # containers sharing an alias — the upstream form returned 504 after the
    # address moved, the form below returned 200 without a restart.
    #
    # The cost is the keepalive pool, which cannot survive without an upstream
    # block. Measured head to head on this host, same container, same protocol,
    # 40 requests per arm: keepalive 4.17 and 4.51 ms/req, this form 4.83 and
    # 4.68 — a difference inside the run-to-run spread, on a service taking
    # ~0.2 requests a second. Ten seconds of possible staleness in exchange for
    # never again being permanently wrong.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Don't leak the nginx version in responses / error pages
    server_tokens off;

    # The default `combined` format carries no timings, which left this system
    # with no server-side latency data at all except `duration_ms` in the app
    # log — and that lives only as long as the container. Deciding whether the
    # dashboard was slow took three agents arguing over 6.2 hours of logs and a
    # single user session, when two extra fields would have answered it.
    #
    # rt  — time to serve the client, including the network back to them.
    # urt — time the app itself took. The gap between the two separates a slow
    #       backend from a slow connection, which is not otherwise knowable.
    log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                     'rt=$request_time urt=$upstream_response_time';

    # /var/log/nginx/access.log is the image's symlink to stdout, so this still
    # lands in `docker logs` — and now under the retention set in compose.
    access_log /var/log/nginx/access.log timed;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 3;  # Reduced from 5 (80-90% of compression, 50% less CPU)
    gzip_types application/json application/javascript text/css text/plain text/xml application/xml;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name ksanalytics.duckdns.org;
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name ksanalytics.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/ksanalytics.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ksanalytics.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL session caching (reduces handshake time)
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ─── Security headers ────────────────────────────────────────────────
        # nginx replaces inherited `add_header` directives in any location that
        # declares its own. /api/ uses `expires` (different directive, doesn't
        # trigger the reset) so it inherits these. /static/ uses `add_header`
        # for `immutable` and therefore re-includes this file.
        include /etc/nginx/security-headers.conf;

        # Limit request body size — mitigates body-flood DoS
        client_max_body_size 2m;

        # The upstream host as a VARIABLE. This is the whole mechanism: nginx
        # resolves a literal name once, at config load, but re-resolves one
        # that arrives through a variable on every request, honouring the
        # `resolver` TTL above.
        #
        # Note there is no URI part after the port. That matters — with a URI
        # part, a variable `proxy_pass` changes how the location prefix is
        # substituted and needs an explicit `rewrite`. Without one, the request
        # URI is passed through unchanged, which is what every location below
        # was already relying on. Verified against the live backend before this
        # was written: /api/health through this form returns the real payload.
        set $web_upstream web;

        # Custom error pages for gateway errors
        error_page 502 503 504 /error.html;
        location = /error.html {
            root /etc/nginx/html;
            internal;
        }

        # WebSocket endpoints - persistent connections with upgrade headers
        location /ws/ {
            proxy_pass http://$web_upstream:8080;
            proxy_http_version 1.1;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Longer timeouts for persistent connections
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;

            # Disable buffering for real-time communication
            proxy_buffering off;
        }

        # Slow API endpoints (train, tune, evaluate, resync) — extended timeout
        location ~ ^/api/(revenue/forecast/(tune|train|evaluate)|duckdb/resync|goals/recalculate|stocks/analysis) {
            proxy_pass http://$web_upstream:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # API endpoints with caching headers
        location /api/ {
            proxy_pass http://$web_upstream:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Short cache for API responses. Using `expires` (not add_header)
            # so server-level security headers stay inherited.
            expires 60s;
        }

        # Static files with long cache
        location /static/ {
            proxy_pass http://$web_upstream:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # `immutable` isn't expressible via `expires`, so we keep add_header
            # here. That resets inherited security headers — re-include them.
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
        }

        location / {
            proxy_pass http://$web_upstream:8080;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
