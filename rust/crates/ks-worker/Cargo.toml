[package]
name = "ks-worker"
version = "0.1.0"
description = "The core's jobs in Rust; К1 runs one, ch_sync, the ClickHouse copy"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ks-core = { path = "../ks-core" }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "rust_decimal"] }
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
