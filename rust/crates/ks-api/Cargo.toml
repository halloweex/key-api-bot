[package]
name = "ks-api"
version = "0.1.0"
description = "Pilot: GET /api/revenue/trend over Postgres Gold, answer for answer with the Python app"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `X-Pilot-Now` sets the trend's "today": the harness's frozen clock. Built
# into the harness image only — the runtime image has no such door.
test-clock = []

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", default-features = false }
form_urlencoded = "1"
hmac = "0.12"
miniz_oxide = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "rust_decimal"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util"] }
tower-http = { version = "0.7", default-features = false, features = ["catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
